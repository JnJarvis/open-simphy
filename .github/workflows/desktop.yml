name: Native desktop build verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    name: desktop / ${{ matrix.toolchain }} / ${{ matrix.config }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        toolchain: [msvc, gcc, appleclang]
        config: [Debug, Release]
        include:
          - toolchain: msvc
            os: windows-2022
            cc: cl
            cxx: cl
            compiler_id: MSVC
          - toolchain: gcc
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            compiler_id: GNU
          - toolchain: appleclang
            os: macos-15
            cc: clang
            cxx: clang++
            compiler_id: AppleClang
          - config: Debug
            tests: 'ON'
          - config: Release
            tests: 'OFF'
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
      - name: Select MSVC 14.44
        if: matrix.toolchain == 'msvc'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
          toolset: '14.44'
          vsversion: '2022'
      - name: Select Xcode 16.4
        if: matrix.toolchain == 'appleclang'
        run: echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Install Linux window development libraries
        if: matrix.toolchain == 'gcc'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Install exact build tools
        run: python -m pip install cmake==3.28.4 ninja==1.11.1.4
      - name: Exercise verification failure paths
        run: python cmake/checks/verify_desktop.py --self-test
      - name: Configure native app
        run: cmake -S . -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DOPENSIM_BUILD_APP=ON -DOPENSIM_BUILD_TESTS=${{ matrix.tests }} -DOPENSIM_WARNINGS_AS_ERRORS=ON -DOPENSIM_EXPECT_COMPILER_ID=${{ matrix.compiler_id }}
      - name: Build native app and enabled tests
        run: cmake --build build/desktop --parallel 3
      - name: Run headless suite in app-enabled build
        if: matrix.config == 'Debug'
        run: ctest --test-dir build/desktop --output-on-failure --no-tests=error
      - name: Verify executable notices and unattended failure paths
        run: python cmake/checks/verify_desktop.py build/desktop --tests ${{ matrix.tests }}
